name: pr-review

# Deterministic diff review on every PR: diff shape plus per-file secret and
# quality heuristics via `construct review pr` (lib/review-pr.mjs, ADR-0069).
# No model, no repo secrets — so it runs identically for fork and in-repo
# PRs. Findings are advisory (blocking enforcement lives in the dedicated
# secret-scanning and lint gates); the job fails only when the review itself
# fails to run. An LLM cx-reviewer pass is a local/orchestration capability,
# not a CI one: fork-PR runners never have provider keys.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci --ignore-scripts

      # No `|| true`, no fallback JSON: a review that cannot run must fail the
      # job visibly rather than post a shrug (the pre-ADR-0069 workflow masked
      # a Usage error for its entire life). Base is fetched with full history
      # so the three-dot merge-base diff can resolve.
      - name: Run construct review on the PR diff
        id: review
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          mkdir -p .cx
          node ./bin/construct review pr --base="origin/$BASE_REF" --output=.cx/pr-review.json

      # Fork PRs run with a read-only GITHUB_TOKEN (pull-requests: write is not
      # granted to workflows triggered from forks), so `gh pr comment` fails with
      # "Resource not accessible by integration". Publish to the job summary
      # instead for forks; in-repo PRs keep the inline comment.
      - name: Post review summary as a PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          REPO="${GITHUB_REPOSITORY}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BODY="$(jq -r '
            "## construct review pr (deterministic, read-only)\n\n" +
            (if .summary then .summary + "\n\n" else "" end) +
            (if (.findings // []) | length == 0 then "No findings."
             else "### Findings\n\n" + ((.findings | map("- **" + (.severity // "info") + "**: " + (.message // .summary // "(no message)"))) | join("\n"))
             end)
          ' .cx/pr-review.json)"
          if [ "$IS_FORK" = "true" ]; then
            printf '%s\n' "$BODY" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
          fi
