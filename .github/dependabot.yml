version: 2
updates:
  # npm dependencies. target-branch follows the environment-promotion flow
  # (work integrates on staging, main is promotion-only) — dependabot PRs into
  # main sat unmergeable and were batch-closed on 2026-07-07.
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
      minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions — keeps action pins from drifting
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
